# Owner, description and the meaning of every column for each gold table of this domain.
tables:
- name: gold.dim_model
  owner: Agent domain team
  description: Star dimension. One row per AI model in a recorded evaluation.
  columns:
  - name: model_key
    meaning: Surrogate key of the AI model.
    pii: false
  - name: model
    meaning: Model identifier.
    pii: false
  - name: model_family
    meaning: Model family name.
    pii: false
- name: gold.fact_agent_choice
  owner: Agent domain team
  description: One row per model per shopping task per condition. Choices, not purchases.
  columns:
  - name: model_key
    meaning: Surrogate key of the AI model.
    pii: false
  - name: chosen_merchant_key
    meaning: Key of the business the agent chose; null when it chose none.
    pii: false
  - name: model
    meaning: Model identifier.
    pii: false
  - name: task_id
    meaning: Shopping task number.
    pii: false
  - name: mode
    meaning: baseline or verified.
    pii: false
  - name: condition_label
    meaning: The condition in plain words.
    pii: false
  - name: request
    meaning: What the shopper asked.
    pii: false
  - name: chosen_merchant_id
    meaning: Business the agent chose.
    pii: false
  - name: chosen_merchant_name
    meaning: Name of the business the agent chose.
    pii: false
  - name: chosen_standing
    meaning: Standing of the chosen business.
    pii: false
  - name: chose_small_shop
    meaning: True when an honest small shop was chosen (a PayPal or joined shop whose seal is not withdrawn).
    pii: false
  - name: chose_chain
    meaning: True when a national chain was chosen.
    pii: false
  - name: chose_withdrawn_shop
    meaning: True when a shop whose seal Real Deal Seal withdrew was chosen.
    pii: false
  - name: chose_fake_badge_shop
    meaning: True when the shop with the forged badge was chosen.
    pii: false
  - name: no_pick
    meaning: True when the agent chose nothing.
    pii: false
  - name: tool_calls
    meaning: Tool calls in the run.
    pii: false
  - name: read_evidence
    meaning: True when the agent read merchant evidence.
    pii: false
  - name: cost_usd
    meaning: Model cost of the run.
    pii: false
  - name: input_tokens
    meaning: Input tokens.
    pii: false
  - name: output_tokens
    meaning: Output tokens.
    pii: false
- name: gold.fact_agent_switch
  owner: Agent domain team
  description: One row per model per task, pairing the baseline choice with the evidence-enabled choice.
  columns:
  - name: model_key
    meaning: Surrogate key of the AI model.
    pii: false
  - name: model
    meaning: Model identifier.
    pii: false
  - name: task_id
    meaning: Shopping task number.
    pii: false
  - name: request
    meaning: What the shopper asked.
    pii: false
  - name: baseline_merchant_id
    meaning: Business chosen with search only.
    pii: false
  - name: evidence_merchant_id
    meaning: Business chosen with evidence.
    pii: false
  - name: baseline_small
    meaning: True when the baseline pick was a small shop.
    pii: false
  - name: evidence_small
    meaning: True when the evidence pick was a small shop.
    pii: false
  - name: baseline_withdrawn
    meaning: True when the baseline pick was a shop whose seal was withdrawn.
    pii: false
  - name: evidence_withdrawn
    meaning: True when the evidence pick was a shop whose seal was withdrawn.
    pii: false
  - name: switch_type
    meaning: chain_to_small, scam_to_small, small_to_chain, small_to_scam, same_shop or other_change.
    pii: false
- name: gold.fact_attack_run
  owner: Agent domain team
  description: One row per model per pre-registered attack, with the outcome graded by its written rule.
  columns:
  - name: model_key
    meaning: Surrogate key of the AI model.
    pii: false
  - name: model
    meaning: Model identifier.
    pii: false
  - name: attack_id
    meaning: Attack identifier.
    pii: false
  - name: request
    meaning: What the shopper asked.
    pii: false
  - name: pass_rule
    meaning: The written pass rule.
    pii: false
  - name: why
    meaning: Why the request is a trap.
    pii: false
  - name: outcome
    meaning: passed or failed, by the written rule.
    pii: false
  - name: passed
    meaning: True when the attack was resisted.
    pii: false
- name: gold.fact_agent_repeat
  owner: Agent domain team
  description: One row per model per full run of the evaluation per condition, so run-to-run variation is visible. Run 1 is the primary recorded run.
  columns:
  - name: model_key
    meaning: Surrogate key of the AI model.
    pii: false
  - name: model
    meaning: Model identifier.
    pii: false
  - name: run_no
    meaning: Which full run of the 50 requests and the attacks this is. 1 is the primary run.
    pii: false
  - name: mode
    meaning: baseline (Evidence off) or verified (Evidence on).
    pii: false
  - name: condition_label
    meaning: Display label of the condition.
    pii: false
  - name: tasks
    meaning: Shopping requests in the run.
    pii: false
  - name: honest_small_picks
    meaning: Picks of an honest small shop (seal not withdrawn).
    pii: false
  - name: withdrawn_shop_picks
    meaning: Picks of a shop whose seal was withdrawn.
    pii: false
  - name: chain_picks
    meaning: Picks of a national chain.
    pii: false
  - name: fake_badge_picks
    meaning: Picks of the shop with the forged badge.
    pii: false
  - name: no_picks
    meaning: Requests with no pick, including runs with no answer.
    pii: false
  - name: attacks_passed
    meaning: Attacks resisted in this run (Evidence on only).
    pii: false
  - name: attacks_total
    meaning: Attacks in this run (Evidence on only).
    pii: false
  - name: recorded_on
    meaning: Date the run finished.
    pii: false
- name: gold.fact_agent_run
  owner: Agent domain team
  description: Every recorded pick in every full run of the evaluation. One row per model per run per shopping request per condition.
  columns:
  - name: model_key
    meaning: Surrogate key of the AI model.
    pii: false
  - name: model
    meaning: Model identifier.
    pii: false
  - name: run_no
    meaning: Which full run of the evaluation this is. 1 is the primary run.
    pii: false
  - name: task_id
    meaning: Shopping request number, 1 to 50.
    pii: false
  - name: mode
    meaning: baseline (Evidence off) or verified (Evidence on).
    pii: false
  - name: condition_label
    meaning: Evidence off or Evidence on.
    pii: false
  - name: request
    meaning: What the shopper asked.
    pii: false
  - name: chosen_merchant_id
    meaning: Shop the assistant picked, if any.
    pii: false
  - name: chosen_merchant_name
    meaning: Name of the picked shop.
    pii: false
  - name: pick_kind
    meaning: Honest small shop, Seal withdrawn, Chain, Forged badge or No pick. Fixed by the shop, not by the answer.
    pii: false
  - name: tool_calls
    meaning: Tools the assistant called in the run.
    pii: false
  - name: answered
    meaning: False when the model gave no answer after four tries.
    pii: false
  - name: cost_usd
    meaning: Model cost of the run, when a price is recorded for the model.
    pii: false
  - name: recorded_on
    meaning: Date of the run.
    pii: false
